name: LexPilot CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx
      # evals/ (retrieval + classifier benchmarks) need live Qdrant, Postgres and an LLM: run locally
      - run: pytest -q --cov=agents --cov=backend_api --cov=config --cov=ingestion --cov-fail-under=60
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lexpilot .
